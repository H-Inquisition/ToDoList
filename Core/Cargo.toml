[workspace]
members = [
    "to_do_list_api",
    "to_do_list_core",
    "to_do_list_integration_tests",
    "to_do_list_runner",
]

[package]
name = "to_do_list"
version = "0.1.0"
edition = "2024"

[dependencies]
# Local crates
runner.workspace = true

# crates.io
tokio.workspace = true

[workspace.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum_macros = "0.28.0"
api = { path = "to_do_list_api" }
core = { path = "to_do_list_core" }
integration_tests = { path = "to_do_list_integration_tests" }
runner = { path = "to_do_list_runner" }
